<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travailler en France</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  🇫🇷 <b>Travailler en France</b>
  <small>Inscription aux offres d'emploi</small>
</header>

<main>

<section class="hero">
  <h1>Trouvez votre opportunité de travail en France</h1>
  <p>Inscrivez-vous et choisissez le métier qui vous intéresse.</p>
</section>

<section class="card">
  <h2>Formulaire d'inscription</h2>

  <form id="form">

    <label>
      Nom et prénom
      <input id="nom" type="text" required>
    </label>

    <label>
      Adresse e-mail
      <input id="email" type="email" required>
    </label>

    <label>
      Pays
      <select id="pays" required>
        <option value="">Choisir</option>
        <option>Bénin</option>
        <option>Sénégal</option>
        <option>Togo</option>
        <option>Niger</option>
        <option>Côte d'Ivoire</option>
        <option>Burkina Faso</option>
        <option>Ghana</option>
        <option>Autre</option>
