<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription envoyée</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #f5f7fb;
        }

        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 35px 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1f7a3f;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>✅ Merci pour votre demande d'inscription !</h1>

    <p>
        Votre demande a bien été enregistrée.
    </p>

    <p>
        <strong>
            Veuillez attendre la suite des informations dans votre e-mail.
        </strong>
    </p>

    <p>
        Pensez également à vérifier votre dossier <strong>Spam</strong>.
    </p>
</div>

</body>
</html>
